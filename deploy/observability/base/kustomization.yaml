# The namespaced half of metrics, applied every deploy: Grafana Alloy
# reads ServiceMonitors, scrapes, stamps env + cluster on every series,
# and pushes OTLP to the LGTM box. kind/ and prod/ overlays set the two
# labels; deploy/prod includes prod/, `make up` applies kind/.
#
# Needs bootstrap/ applied first (the CRD, Alloy's ClusterRole, CD's
# widened Role) — cluster-scoped things CD may not create.
#
# Alloy sits in the game's namespace so CD's namespace-scoped Role
# reaches it, but WITHOUT the part-of label: `make up` prunes labeled
# Deployments that are not in deploy/manifests, and these are not.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: space-adventure
resources:
  - alloy.yaml
  - servicemonitor-server.yaml
configMapGenerator:
  - name: alloy-config
    files:
      - config.alloy
