# What to scrape: the game server's metrics port (server/cmd/server
# -metrics). Needs the CRD from bootstrap/ to exist first.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: server
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/part-of: space-adventure
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: server
  endpoints:
    - port: metrics
      interval: 15s
