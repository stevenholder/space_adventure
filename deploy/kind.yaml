# kind cluster for local Space Adventure development.
#
# Single control-plane node. Workloads are reached from the host through
# extraPortMappings onto NodePort services -- NOT `kubectl port-forward`.
#
# Why: port-forward is a userspace proxy that EXITS on any broken pipe
# ("error: lost connection to pod"). One abruptly-dropped WebSocket takes the
# whole forward down, which makes the game unreachable in the browser and
# breaks the e2e suite mid-run -- and t4 drops connections abruptly on purpose,
# because that is the behaviour it exists to test. It also added its own
# latency jitter to the criterion 7 measurement. A kind port mapping is
# kernel-level: nothing to supervise, nothing to restart, no added jitter.
#
# The host ports are fixed at cluster-creation time, so changing them means
# recreating the cluster (`make down && make up SERVER_PORT=...` will not move
# them on its own).
#
# Only the server is mapped. The client is a packaged desktop build that
# connects in, not a page this cluster serves (ROADMAP U18).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: space-adventure
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # server Service nodePort -> host :18080
        hostPort: 18080
        protocol: TCP
