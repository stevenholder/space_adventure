# LOCAL DEVELOPMENT ONLY: the password in this Secret is a fixed dev-only
# credential for a kind cluster reachable only on localhost. A real
# deployment supplies this Secret out-of-band and never from the repo.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
  namespace: space-adventure
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: space-adventure
type: Opaque
stringData:
  POSTGRES_USER: space
  POSTGRES_PASSWORD: dev-only-local-kind-password
  POSTGRES_DB: space
  DATABASE_URL: postgres://space:dev-only-local-kind-password@postgres:5432/space?sslmode=disable
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: space-adventure
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: space-adventure
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: space-adventure
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: space-adventure
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the PVC is ReadWriteOnce, so a new pod cannot
  # mount the volume while the old one still holds it — a rolling update would
  # deadlock on every change.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: space-adventure
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          envFrom:
            - secretRef:
                name: postgres-auth
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "space", "-d", "space"]
            initialDelaySeconds: 5
            periodSeconds: 5
          # Liveness is deliberately slower and more forgiving than readiness:
          # pg_isready fails while initdb runs on an empty volume, and a 5 s
          # liveness probe would kill the pod mid-initialisation and loop
          # forever. Readiness keeps traffic away; liveness only restarts a
          # server that is genuinely wedged.
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "space", "-d", "space"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: space-adventure
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: space-adventure
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
