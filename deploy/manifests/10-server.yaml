apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: space-adventure
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/part-of: space-adventure
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server
        app.kubernetes.io/part-of: space-adventure
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: server
          image: space-adventure/server:latest
          imagePullPolicy: IfNotPresent
          env:
            # Traces -> Alloy (deploy/observability). Unset = tracing off.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy:4317
            - name: DEPLOY_ENV
              value: kind
            # Phase 16: the harness fleet joins with made-up tokens. A server
            # with a store seats only account characters unless this is set;
            # production never sets it (deploy/prod/20-server.yaml).
            - name: SA_GUESTS
              value: "1"
            # Phase 22: a character starts with nothing (items.json). The
            # harness fleet and the screenshot rig buy things, so the kind
            # server seats them rich; production never sets it.
            - name: SA_START
              value: "credits=3000,ammo.cell=120"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: DATABASE_URL
          ports:
            - name: http
              containerPort: 8080
            # Prometheus scrape target (deploy/observability). Its own
            # listener so the ingress, which routes the whole origin,
            # never exposes it.
            - name: metrics
              containerPort: 9100
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: space-adventure
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/part-of: space-adventure
spec:
  # NodePort + kind extraPortMappings: reachable on the host with no
  # port-forward proxy in the path (deploy/kind.yaml).
  type: NodePort
  selector:
    app.kubernetes.io/name: server
  ports:
    - name: http
      port: 8080
      nodePort: 30080
      targetPort: http
    - name: metrics
      port: 9100
      targetPort: metrics
