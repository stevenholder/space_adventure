# Client exposure through the cluster's existing Traefik LoadBalancer,
# path-routed with NO host rule: clients dial any node IP —
# ws://192.168.1.163/ws — and nothing depends on LAN DNS existing. Only
# the three paths the server actually serves are claimed, so Traefik's
# port 80 stays free for anything else this cluster hosts. WebSocket
# upgrade needs no annotation on Traefik.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: server
  namespace: space-adventure
  labels:
    app.kubernetes.io/part-of: space-adventure
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /ws
            pathType: Exact
            backend:
              service:
                name: server
                port:
                  name: http
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: server
                port:
                  name: http
          - path: /version
            pathType: Exact
            backend:
              service:
                name: server
                port:
                  name: http
