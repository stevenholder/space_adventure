# Postgres is reachable from exactly three things: the game server, the
# other CNPG instances (replication), and the CNPG operator (management).
# C52 says this is PROBED, not assumed — the harness sweep includes a pod
# that tries and must fail.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: space-adventure
  labels:
    app.kubernetes.io/part-of: space-adventure
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: space-db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: server
        - podSelector:
            matchLabels:
              cnpg.io/cluster: space-db
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: db-backup
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
