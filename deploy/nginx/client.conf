# Serves the built client bundle and proxies /ws to the game server so the
# browser talks to both same-origin (no CORS).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /ws {
        proxy_pass http://server:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # WebSocket is long-lived; the default 60 s read timeout would drop
        # quiet connections.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
