<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Space Adventure — M1</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #04060d;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 12px;
        font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #cfe3ff;
        background: rgba(5, 10, 20, 0.55);
        padding: 8px 10px;
        border: 1px solid rgba(120, 160, 255, 0.25);
        border-radius: 6px;
        pointer-events: none;
        white-space: pre;
      }
      #status {
        position: fixed;
        right: 12px;
        top: 12px;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #9fb8e8;
        background: rgba(5, 10, 20, 0.55);
        padding: 6px 10px;
        border-radius: 6px;
        pointer-events: none;
      }
      #hint {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        font: 13px/1.4 system-ui, sans-serif;
        color: #eaf2ff;
        background: rgba(8, 14, 28, 0.72);
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid rgba(120, 160, 255, 0.3);
        pointer-events: none;
        white-space: nowrap;
      }
      #tags {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .tag {
        position: absolute;
        transform: translate(-50%, -100%);
        font: 600 12px/1 system-ui, sans-serif;
        color: #fff;
        text-shadow:
          0 1px 3px #000,
          0 0 6px rgba(0, 0, 0, 0.8);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="status"></div>
    <div id="hint">click to capture mouse — WASD move · mouse look · Shift sprint · Space jump · Esc release</div>
    <div id="tags"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
