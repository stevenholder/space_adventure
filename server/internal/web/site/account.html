<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account — Space Adventure</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1><a href="/">SPACE ADVENTURE</a></h1>
  <nav><span class="dim" id="who"></span> <a href="#" id="logout">sign out</a></nav>

  <div class="panel">
    <h2 style="margin-top:0">Your characters</h2>
    <table id="players"><tbody></tbody></table>
    <p class="dim" id="no-players" hidden>No character yet — sign in to the
    game with this email and password to make one.</p>
  </div>

  <div class="panel">
    <h2 style="margin-top:0">Change password</h2>
    <label for="pw-old">Current password</label>
    <input id="pw-old" type="password" autocomplete="current-password">
    <label for="pw-new">New password (8+)</label>
    <input id="pw-new" type="password" autocomplete="new-password">
    <button id="pw-go" class="quiet">Change password</button>
    <div class="error" id="pw-err"></div>
  </div>

  <div class="panel">
    <h2 style="margin-top:0">Delete account</h2>
    <p class="dim">Removes the account and every character it owns — credits,
    inventory, ships. There is no undo.</p>
    <label for="del-pw">Password to confirm</label>
    <input id="del-pw" type="password" autocomplete="current-password">
    <button id="del-go" class="danger">Delete everything</button>
    <div class="error" id="del-err"></div>
  </div>
</main>
<script src="/app.js"></script>
<script>
function refresh () {
  fetch('/api/me').then((r) => {
    if (r.status === 401) { location.href = '/login.html'; return null }
    return r.json()
  }).then((me) => {
    if (!me) return
    document.getElementById('who').textContent = me.email
    const tbody = document.querySelector('#players tbody')
    tbody.innerHTML = ''
    document.getElementById('no-players').hidden = me.players.length > 0
    for (const p of me.players) {
      const items = (p.inventory || []).map((s) => s.qty > 1 ? `${s.item}×${s.qty}` : s.item).join(', ')
      const seen = p.last_seen_ms ? new Date(p.last_seen_ms).toLocaleString() : '—'
      const tr = document.createElement('tr')
      for (const text of [p.name, bodyLabel(p.body), p.credits + ' cr', items || '—', seen]) {
        const td = document.createElement('td')
        td.textContent = text
        tr.appendChild(td)
      }
      tbody.appendChild(tr)
    }
  }).catch(() => {})
}
refresh()

// The game's picker names: model + gender.
function bodyLabel (id) {
  return {
    'char.player': 'Colonist · M', 'char.player.f': 'Colonist · F',
    'char.ubc': 'Vanguard · M', 'char.ubc.f': 'Vanguard · F',
  }[id] || id || '—'
}
wire('pw-go', 'pw-err', () => api('/api/password', { old: val('pw-old'), new: val('pw-new') }).then(() => {
  const el = document.getElementById('pw-err')
  el.classList.add('ok'); el.textContent = 'changed — other sessions signed out'
}))
wire('del-go', 'del-err', () => api('/api/delete', { password: val('del-pw') }).then(() => {
  location.href = '/'
}))
document.getElementById('logout').addEventListener('click', (e) => {
  e.preventDefault()
  api('/api/logout').then(() => location.href = '/')
})
</script>
</body>
</html>
