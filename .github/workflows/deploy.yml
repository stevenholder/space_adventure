# Phase 6 CD (C48): a push to main that passes CI reaches the pandas
# cluster with no human step.
#
# Chained via workflow_run so this NEVER runs on red CI. One workflow does
# image + deploy because they share the answer to "which build": the image
# tag IS the server-subtree hash (the same BUILD_ID /version serves and
# check-server asserts locally), so an unchanged server/ means the image
# already exists and the build step skips itself.
#
# Cluster access: the runner joins the tailnet as an ephemeral tag:ci node
# (OAuth client, writable auth_keys scope), then talks kubectl through the
# Tailscale operator's API-server proxy. The ACL grant maps tag:ci to the
# `ci-deployers` group; deploy/prod/05-rbac.yaml is that group's ceiling —
# this workflow can redeploy the game and nothing else.
#
# Once the rollout is live, `release` publishes a GitHub pre-release for
# the same commit: tag vYYYY.MM.DD-<sha7>, the Linux and Windows client
# exports from the CI run that triggered this deploy, and notes = a fixed
# header (what is live, how to run the downloads) + GitHub's generated list
# of merged PRs since the previous release. A failed rollout means no
# release, so every release is a build that was live.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write  # the release job tags and publishes
  packages: write
  actions: read    # the release job downloads the CI run's client exports

concurrency: deploy-prod

env:
  IMG: ghcr.io/${{ github.repository_owner }}/space_adventure/server

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: build
        name: Compute BUILD_ID (server-subtree hash, same as make's)
        run: echo "id=$(git rev-parse --short HEAD:server)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (skipped when this server build already exists)
        run: |
          TAG='${{ steps.build.outputs.id }}'
          if docker manifest inspect "$IMG:$TAG" >/dev/null 2>&1; then
            echo "image $IMG:$TAG already published — server/ unchanged"
          else
            docker build -f Dockerfile.server --provenance=false \
              --build-arg BUILD_ID="$TAG" -t "$IMG:$TAG" -t "$IMG:latest" .
            docker push "$IMG:$TAG"
            docker push "$IMG:latest"
          fi

      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Point kubectl at the operator's API proxy
        run: tailscale configure kubeconfig tailscale-operator

      - name: Deploy the exact build
        run: |
          TAG='${{ steps.build.outputs.id }}'
          cd deploy/prod
          # Pin the tag without extra tooling: kustomization.yaml carries no
          # images: field in git, so appending one is well-formed.
          cat >> kustomization.yaml <<EOF
          images:
            - name: $IMG
              newTag: $TAG
          EOF
          kubectl apply -k .
          kubectl -n space-adventure rollout status deploy/server --timeout=180s

      - name: Smoke — the cluster serves THIS build, or roll back
        run: |
          TAG='${{ steps.build.outputs.id }}'
          # --quiet, or kubectl's own "pod deleted" chatter lands in $got and
          # a correct deploy fails its own smoke (it did — versions matched).
          got=$(kubectl -n space-adventure run smoke-$RANDOM --rm -i --quiet --restart=Never \
            --image=curlimages/curl:8.10.1 -- -sf http://server:8080/version | head -1 || true)
          echo "cluster serves: $got, pushed: $TAG"
          if [ "$got" != "$TAG" ]; then
            echo "::error::smoke failed — rolling back"
            kubectl -n space-adventure rollout undo deploy/server
            exit 1
          fi

  release:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0  # tags: the previous release bounds the notes

      - id: meta
        name: Tag, previous tag, server build id
        run: |
          SHA='${{ github.event.workflow_run.head_sha }}'
          echo "tag=v$(date -u +%Y.%m.%d)-${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-parse --short HEAD:server)" >> "$GITHUB_OUTPUT"
          echo "prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Download the client exports from the CI run that was deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download '${{ github.event.workflow_run.id }}' -n client-linux -D client-linux
          gh run download '${{ github.event.workflow_run.id }}' -n client-windows -D client-windows

      - name: Package (restore the exec bit in case the artifact round-trip dropped it)
        run: |
          TAG='${{ steps.meta.outputs.tag }}'
          chmod +x client-linux/SpaceAdventure.x86_64
          tar -C client-linux -czf "SpaceAdventure-$TAG-linux-x86_64.tar.gz" .
          (cd client-windows && zip -qr "../SpaceAdventure-$TAG-windows-x86_64.zip" .)
          ls -la SpaceAdventure-*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ steps.meta.outputs.tag }}'
          SHA='${{ github.event.workflow_run.head_sha }}'
          PREV='${{ steps.meta.outputs.prev }}'
          BUILD='${{ steps.meta.outputs.build }}'
          # What changed: GitHub's generated notes (merged PR titles, new
          # contributors, full-changelog link) bounded by the previous v* tag.
          if [ -n "$PREV" ]; then
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$SHA" -f previous_tag_name="$PREV" \
              --jq .body > changes.md
          else
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$SHA" --jq .body > changes.md
          fi
          cat > notes.md <<EOF
          Live now at **wss://game.stevenholder.info/ws** — server build \`$BUILD\`, commit \`${SHA:0:7}\`.

          ### Downloads
          - **Windows** — \`SpaceAdventure-$TAG-windows-x86_64.zip\`: unzip, run \`SpaceAdventure.exe\`. It connects to the live server by itself.
          - **Linux** — \`SpaceAdventure-$TAG-linux-x86_64.tar.gz\`: extract, run \`./SpaceAdventure.x86_64\`.

          Keep the \`art/\` folder beside the executable (it is inside the archive). Another server: \`SpaceAdventure.exe -- -serverUrl ws://host:port/ws\`. Move with WASD, look with the mouse, E interacts, K skills, M map, J journal, Esc frees the cursor.

          EOF
          cat changes.md >> notes.md
          gh release create "$TAG" --target "$SHA" --prerelease \
            --title "Space Adventure $TAG" --notes-file notes.md \
            SpaceAdventure-*.tar.gz SpaceAdventure-*.zip
