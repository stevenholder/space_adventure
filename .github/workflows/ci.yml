# C44: the whole client compiles and its headless checks run in CI, on every
# commit, with no engine installed — Godot.NET.Sdk pulls GodotSharp from NuGet.
# C91's grep gate runs here too — a convention nobody checks is a convention
# that lasts two weeks. The export itself (godot-build) needs the editor binary
# and templates; it gets its own job at the cutover.
name: ci

# Push runs main only (deploy.yml waits on that run). A feature branch is
# checked by its pull request; pushing `feat/**` too ran every job twice
# on the same commit.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test ./...

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make godot-gate
      - run: make godot-test
      - run: make godot-codec
      - run: make godot-conformance

  # C86 in CI: the export itself. Needs the Godot editor binary and the
  # export templates, which the action fetches by the version pinned in
  # client/.godot-version. The Linux artifact is the packaged player.
  client-export:
    runs-on: ubuntu-latest
    needs: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - id: godot
        run: echo "version=$(tr -d '[:space:]' < client/.godot-version)" >> "$GITHUB_OUTPUT"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ steps.godot.outputs.version }}
          use-dotnet: true
          include-templates: true
      - uses: actions/setup-go@v5  # go-winres stamps VERSIONINFO onto the Windows exe (godot-cli build)
        with:
          go-version-file: server/go.mod
      # PRs export too (the check that it still builds) but upload nothing:
      # only deploy.yml reads these, from the main push run, within minutes,
      # and the release keeps the lasting copy. 3 days covers a deploy re-run.
      - run: ./client/godot-cli build Linux
        env:
          GODOT: ${{ env.GODOT4 }}
      - run: ./client/godot-cli build Windows
        env:
          GODOT: ${{ env.GODOT4 }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: client-linux
          path: client/build/linux
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: client-windows
          path: client/build/windows
          retention-days: 3
